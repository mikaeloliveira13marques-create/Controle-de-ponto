<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-BL Controle de Ponto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: '#CCFF00', 
                        neonDark: '#AADD00',
                        darkText: '#1A1A1A',
                        lightGray: '#F7F7F9',
                        cardGray: '#FFFFFF',
                        danger: '#FF4D4D'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F7F7F9; color: #1A1A1A; }
        .custom-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #CCFF00; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // COLE A SUA URL AQUI DENTRO DAS ASPAS:
        const API_URL = 'https://script.google.com/macros/s/AKfycby24lusY9oF4rVcXQxy--TNELp-npdypIpPyCWrImA1iyZ0lO02uV7TUHSPFTQ69gjhhg/exec';

        const timeToMinutes = (timeStr) => {
            if (!timeStr) return 0;
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        };

        const minutesToTime = (mins) => {
            const isNeg = mins < 0;
            const absMins = Math.abs(mins);
            const h = Math.floor(absMins / 60);
            const m = absMins % 60;
            return `${isNeg ? '-' : ''}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        };

        const getTodayDateStr = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const getCurrentPeriodLabel = () => {
            const today = new Date();
            let start, end;
            if (today.getDate() >= 16) {
                start = new Date(today.getFullYear(), today.getMonth(), 16);
                end = new Date(today.getFullYear(), today.getMonth() + 1, 15);
            } else {
                start = new Date(today.getFullYear(), today.getMonth() - 1, 16);
                end = new Date(today.getFullYear(), today.getMonth(), 15);
            }
            return `${start.toLocaleDateString('pt-BR')} até ${end.toLocaleDateString('pt-BR')}`;
        };

        const GrowthChart = ({ data }) => {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            React.useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => d.date),
                        datasets: [{
                            label: 'Horas Devidas Acumuladas',
                            data: data.map(d => d.divida),
                            borderColor: '#FF4D4D', 
                            backgroundColor: 'rgba(255, 77, 77, 0.2)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.3,
                            pointBackgroundColor: '#FF4D4D',
                            pointBorderColor: '#1A1A1A',
                            pointRadius: 4,
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { callbacks: { label: function(c) { return c.parsed.y > 0 ? `Devendo: ${c.parsed.y}h` : `Crédito extra: ${Math.abs(c.parsed.y)}h`; } } }
                        },
                        scales: {
                            y: { grid: { color: '#F3F4F6' }, title: { display: true, text: 'Horas Negativas (Devidas)' } },
                            x: { grid: { display: false } }
                        }
                    }
                });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [data]);
            return <div className="relative h-72 w-full"><canvas ref={chartRef}></canvas></div>;
        };

        const App = () => {
            const [records, setRecords] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [syncing, setSyncing] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [dateFilter, setDateFilter] = React.useState({ start: '', end: '' });
            const [editingId, setEditingId] = React.useState(null);
            
            const [newRecord, setNewRecord] = React.useState({
                date: '', ent1: '', sai1: '', ent2: '', sai2: '', target: '09:00', note: ''
            });

            // Carrega os dados da Planilha
            React.useEffect(() => {
                fetch(API_URL)
                    .then(res => res.json())
                    .then(data => {
                        setRecords(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("Erro na API:", err);
                        setLoading(false);
                        alert("Certifique-se de colar a URL gerada do Apps Script no código.");
                    });
            }, []);

            const handleAddOrUpdate = (e) => {
                e.preventDefault();
                if (!newRecord.date) return;
                setSyncing(true);
                
                let tgt = newRecord.target;
                const d = new Date(newRecord.date + 'T00:00:00');
                if (d.getDay() === 5 && newRecord.target === '09:00') tgt = '08:00';

                const recordToSave = { ...newRecord, target: tgt, id: editingId || Date.now().toString() };

                // Atualiza visualmente na hora
                if (editingId) {
                    setRecords(records.map(r => r.id === editingId ? recordToSave : r));
                } else {
                    setRecords([...records, recordToSave]);
                }

                // Manda para a planilha
                fetch(`${API_URL}?action=save`, {
                    redirect: "follow",
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(recordToSave)
                }).then(() => {
                    setSyncing(false);
                    setEditingId(null);
                    setNewRecord({ date: '', ent1: '', sai1: '', ent2: '', sai2: '', target: '09:00', note: '' });
                }).catch(err => {
                    console.error(err);
                    setSyncing(false);
                });
            };

            const handleEditClick = (rec) => {
                setNewRecord({
                    date: rec.date, ent1: rec.ent1 || '', sai1: rec.sai1 || '', ent2: rec.ent2 || '',
                    sai2: rec.sai2 || '', target: rec.target || '09:00', note: rec.note || ''
                });
                setEditingId(rec.id);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleDeleteClick = (id) => {
                if(confirm("Tem certeza que deseja excluir este dia?")) {
                    setSyncing(true);
                    setRecords(records.filter(r => r.id !== id));
                    if (editingId === id) {
                        setEditingId(null);
                        setNewRecord({ date: '', ent1: '', sai1: '', ent2: '', sai2: '', target: '09:00', note: '' });
                    }

                    fetch(`${API_URL}?action=delete`, {
                        redirect: "follow",
                        method: 'POST',
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({id: id})
                    }).then(() => setSyncing(false)).catch(e => setSyncing(false));
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center flex-col gap-4 text-darkText">
                        <div className="loader"></div>
                        <p className="font-bold">Sincronizando com a Planilha...</p>
                    </div>
                );
            }

            let totalBalanceMinutes = 0;
            let runningTotal = 0;
            
            const processedRecords = records.map(rec => {
                let workedMins = 0;
                if (rec.ent1 && rec.sai1) workedMins += (timeToMinutes(rec.sai1) - timeToMinutes(rec.ent1));
                if (rec.ent2 && rec.sai2) workedMins += (timeToMinutes(rec.sai2) - timeToMinutes(rec.ent2));

                const targetMins = timeToMinutes(rec.target);
                const balanceMins = workedMins > 0 || rec.sai1 ? workedMins - targetMins : 0; 
                
                totalBalanceMinutes += balanceMins;
                runningTotal += balanceMins;

                let expectedExit = null;
                if (rec.ent1 && !rec.sai2) {
                    if (rec.ent2) {
                        const minsLeft = targetMins - (timeToMinutes(rec.sai1) - timeToMinutes(rec.ent1));
                        expectedExit = minutesToTime(timeToMinutes(rec.ent2) + minsLeft);
                    } else if (rec.sai1) {
                        const minsLeft = targetMins - (timeToMinutes(rec.sai1) - timeToMinutes(rec.ent1));
                        expectedExit = minutesToTime(timeToMinutes(rec.sai1) + 60 + minsLeft) + " (+1h almoço est.)";
                    } else {
                        expectedExit = minutesToTime(timeToMinutes(rec.ent1) + targetMins + 60) + " (+1h almoço est.)";
                    }
                }

                return { ...rec, workedMins, workedStr: minutesToTime(workedMins), balanceMins, balanceStr: minutesToTime(balanceMins), cumulativeMins: runningTotal, expectedExit };
            }).sort((a, b) => new Date(a.date) - new Date(b.date));

            const todayStr = getTodayDateStr();
            const todayRecord = processedRecords.find(r => r.date === todayStr);

            const currentPeriodRecords = processedRecords.filter(rec => {
                const d = new Date(rec.date + 'T00:00:00');
                const today = new Date();
                let start, end;
                if (today.getDate() >= 16) {
                    start = new Date(today.getFullYear(), today.getMonth(), 16);
                    end = new Date(today.getFullYear(), today.getMonth() + 1, 15);
                } else {
                    start = new Date(today.getFullYear(), today.getMonth() - 1, 16);
                    end = new Date(today.getFullYear(), today.getMonth(), 15);
                }
                return d >= start && d <= end;
            });

            const calendarFilteredRecords = processedRecords.filter(rec => {
                if (dateFilter.start && rec.date < dateFilter.start) return false;
                if (dateFilter.end && rec.date > dateFilter.end) return false;
                return true;
            });

            const displayedRecords = activeTab === 'dashboard' ? currentPeriodRecords : calendarFilteredRecords;

            const periodWorkedMins = calendarFilteredRecords.reduce((acc, rec) => acc + rec.workedMins, 0);
            const periodBalanceMins = calendarFilteredRecords.reduce((acc, rec) => acc + rec.balanceMins, 0);
            const periodWorkedStr = minutesToTime(periodWorkedMins);
            const periodBalanceStr = minutesToTime(Math.abs(periodBalanceMins));
            const periodIsPositive = periodBalanceMins >= 0;

            const chartData = processedRecords.map(rec => ({
                date: new Date(rec.date + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }),
                divida: ((rec.cumulativeMins * -1) / 60).toFixed(2)
            }));

            const balanceIsPositive = totalBalanceMinutes >= 0;
            const totalHoursStr = minutesToTime(Math.abs(totalBalanceMinutes));
            
            let compMsg = "O teu saldo global está positivo. Excelente trabalho!";
            if (!balanceIsPositive) {
                const minsPerDay = Math.ceil(Math.abs(totalBalanceMinutes) / 22);
                compMsg = `Para zerar as tuas horas devidas no próximo mês (22 dias úteis), precisas de fazer ${Math.floor(minsPerDay/60)}h ${String(minsPerDay%60).padStart(2, '0')}m extra por dia.`;
            }

            return (
                <div className="min-h-screen flex text-darkText font-sans">
                    <div className="w-20 bg-white border-r border-gray-100 flex flex-col items-center py-6 gap-8 shadow-sm z-10">
                        <div className="w-10 h-10 rounded-full bg-darkText text-neon flex items-center justify-center font-bold text-xl cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                            <i className="ph-fill ph-asterisk"></i>
                        </div>
                        <div className="flex flex-col gap-6 mt-4">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-12 h-12 rounded-full flex items-center justify-center transition custom-shadow ${activeTab === 'dashboard' ? 'bg-neon text-darkText' : 'text-gray-400 hover:bg-gray-50'}`}>
                                <i className="ph ph-clock text-2xl"></i>
                            </button>
                            <button onClick={() => setActiveTab('calendar')} className={`w-12 h-12 rounded-full flex items-center justify-center transition custom-shadow ${activeTab === 'calendar' ? 'bg-neon text-darkText' : 'text-gray-400 hover:bg-gray-50'}`}>
                                <i className="ph ph-calendar-blank text-2xl"></i>
                            </button>
                            <button onClick={() => setActiveTab('chart')} className={`w-12 h-12 rounded-full flex items-center justify-center transition custom-shadow ${activeTab === 'chart' ? 'bg-neon text-darkText' : 'text-gray-400 hover:bg-gray-50'}`}>
                                <i className="ph ph-chart-line-up text-2xl"></i>
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 p-10 overflow-y-auto">
                        <div className="flex justify-between items-center mb-10">
                            <div>
                                <h1 className="text-4xl font-bold tracking-tight">Controle de Ponto</h1>
                                <div className="text-gray-500 mt-1 flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-neon inline-block"></span>
                                    {activeTab === 'dashboard' && 'Dashboard Operacional'}
                                    {activeTab === 'calendar' && 'Gestão de Períodos'}
                                    {activeTab === 'chart' && 'Análise de Dívida de Horas'}
                                </div>
                            </div>
                            <div className="flex items-center gap-4 bg-white p-2 pr-6 rounded-full custom-shadow">
                                <img src="https://ui-avatars.com/api/?name=Mikael+Marques&background=E5E7EB&color=1A1A1A" alt="Profile" className="w-10 h-10 rounded-full" />
                                <div>
                                    <p className="text-sm font-semibold">Mikael Marques</p>
                                    <p className="text-xs text-gray-500">Marketing Sênior</p>
                                </div>
                            </div>
                        </div>

                        {activeTab === 'dashboard' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                <div className="bg-white rounded-3xl p-6 custom-shadow flex flex-col justify-between relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-neon opacity-20 blur-3xl rounded-full -mr-10 -mt-10"></div>
                                    <div className="flex justify-between items-start mb-4">
                                        <div className="flex items-center gap-2 text-sm font-semibold">
                                            <div className={`w-3 h-3 rounded-full ${balanceIsPositive ? 'bg-neon' : 'bg-danger'}`}></div>
                                            Saldo Total Acumulado
                                        </div>
                                        <i className="ph ph-scales text-gray-400 text-xl"></i>
                                    </div>
                                    <div>
                                        <h2 className={`text-5xl font-bold tracking-tighter ${balanceIsPositive ? 'text-darkText' : 'text-danger'}`}>
                                            {balanceIsPositive ? '+' : '-'}{totalHoursStr}
                                        </h2>
                                        <p className="text-sm text-gray-500 mt-2">
                                            {balanceIsPositive ? 'Horas positivas acumuladas' : 'Total de horas devidas'}
                                        </p>
                                    </div>
                                </div>

                                <div className="bg-darkText text-white rounded-3xl p-6 custom-shadow flex flex-col justify-between relative">
                                    <div className="absolute bottom-0 right-0 p-4">
                                        <i className="ph-fill ph-bell-ringing text-neon opacity-20 text-6xl"></i>
                                    </div>
                                    <div className="flex justify-between items-start mb-4">
                                        <div className="flex items-center gap-2 text-sm font-semibold text-neon">
                                            Alerta do Dia
                                        </div>
                                    </div>
                                    <div className="z-10">
                                        <h3 className="text-2xl font-bold mb-2">Previsão de Saída</h3>
                                        {todayRecord && todayRecord.expectedExit ? (
                                            <div>
                                                <p className="text-neon text-4xl font-black mb-1">{todayRecord.expectedExit.split(' ')[0]}</p>
                                                <p className="text-gray-400 text-xs mt-2">Hora prevista baseada nos seus lançamentos de hoje.</p>
                                            </div>
                                        ) : (
                                            <p className="text-gray-300 text-sm">
                                                Nenhum registo de entrada encontrado para hoje ({new Date().toLocaleDateString('pt-BR')}). Adicione no quadro ao lado.
                                            </p>
                                        )}
                                    </div>
                                </div>

                                <div className={`rounded-3xl p-6 custom-shadow flex flex-col justify-between transition-colors ${editingId ? 'bg-gray-800 text-white' : 'bg-neon text-darkText'}`}>
                                    <div className="flex justify-between items-start mb-2">
                                        <div className="flex items-center gap-2 text-sm font-bold">
                                            {editingId ? 'Editar Registo' : 'Registo Rápido'}
                                            {syncing && <span className="ml-2 text-xs opacity-60">Salvando...</span>}
                                        </div>
                                        {editingId ? <i className="ph ph-pencil-simple text-2xl text-neon"></i> : <i className="ph ph-plus-circle text-2xl"></i>}
                                    </div>
                                    <form onSubmit={handleAddOrUpdate} className="flex flex-col gap-2 mt-2">
                                        <div className="flex gap-2">
                                            <input type="date" required value={newRecord.date} onChange={e => setNewRecord({...newRecord, date: e.target.value})} className="bg-white/90 text-darkText p-2 rounded-xl text-xs w-full font-semibold focus:outline-none focus:ring-2 focus:ring-darkText" />
                                            <input type="time" placeholder="Ent 1" value={newRecord.ent1} onChange={e => setNewRecord({...newRecord, ent1: e.target.value})} className="bg-white/90 text-darkText p-2 rounded-xl text-xs w-full font-semibold focus:outline-none focus:ring-2 focus:ring-darkText" />
                                        </div>
                                        <div className="flex gap-2">
                                            <input type="time" placeholder="Sai 1" value={newRecord.sai1} onChange={e => setNewRecord({...newRecord, sai1: e.target.value})} className="bg-white/90 text-darkText p-2 rounded-xl text-xs w-full font-semibold focus:outline-none" />
                                            <input type="time" placeholder="Ent 2" value={newRecord.ent2} onChange={e => setNewRecord({...newRecord, ent2: e.target.value})} className="bg-white/90 text-darkText p-2 rounded-xl text-xs w-full font-semibold focus:outline-none" />
                                            <input type="time" placeholder="Sai 2" value={newRecord.sai2} onChange={e => setNewRecord({...newRecord, sai2: e.target.value})} className="bg-white/90 text-darkText p-2 rounded-xl text-xs w-full font-semibold focus:outline-none" />
                                        </div>
                                        <div className="flex gap-2">
                                            <input type="text" placeholder="Anotações do dia (opcional)..." value={newRecord.note} onChange={e => setNewRecord({...newRecord, note: e.target.value})} className="bg-white/90 text-darkText p-2 rounded-xl text-xs w-full font-semibold focus:outline-none focus:ring-2 focus:ring-darkText" />
                                        </div>
                                        <div className="flex gap-2 mt-1">
                                            <button type="submit" disabled={syncing} className={`rounded-xl py-2 text-sm font-semibold flex-1 transition ${editingId ? 'bg-neon text-darkText hover:bg-neonDark' : 'bg-darkText text-white hover:bg-gray-800'} ${syncing ? 'opacity-50' : ''}`}>
                                                {editingId ? 'Atualizar' : 'Adicionar'}
                                            </button>
                                            {editingId && (
                                                <button type="button" onClick={() => { setEditingId(null); setNewRecord({ date: '', ent1: '', sai1: '', ent2: '', sai2: '', target: '09:00', note: '' }); }} className="bg-gray-600 text-white rounded-xl py-2 px-4 text-sm font-semibold hover:bg-gray-500 transition">
                                                    Cancelar
                                                </button>
                                            )}
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {activeTab === 'calendar' && (
                            <div className="mb-8">
                                <div className="bg-white rounded-3xl p-6 custom-shadow mb-6">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                                        <i className="ph ph-calendar text-neon text-2xl"></i>
                                        Selecionar Período
                                    </h3>
                                    <div className="flex items-center gap-4">
                                        <div className="flex flex-col">
                                            <label className="text-xs text-gray-500 mb-1 font-semibold">Data Inicial</label>
                                            <input type="date" value={dateFilter.start} onChange={e => setDateFilter({...dateFilter, start: e.target.value})} className="bg-lightGray p-3 rounded-xl border border-gray-200 focus:outline-none focus:border-neon" />
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-xs text-gray-500 mb-1 font-semibold">Data Final</label>
                                            <input type="date" value={dateFilter.end} onChange={e => setDateFilter({...dateFilter, end: e.target.value})} className="bg-lightGray p-3 rounded-xl border border-gray-200 focus:outline-none focus:border-neon" />
                                        </div>
                                        <div className="flex flex-col justify-end">
                                            <button onClick={() => setDateFilter({start: '', end: ''})} className="mt-5 text-sm font-semibold text-gray-500 hover:text-darkText transition">
                                                Limpar Filtros
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-white rounded-2xl p-6 custom-shadow flex justify-between items-center border-l-4 border-neon">
                                        <div>
                                            <p className="text-sm text-gray-500 font-semibold mb-1">Horas Trabalhadas no Período</p>
                                            <h4 className="text-4xl font-bold">{periodWorkedStr}</h4>
                                        </div>
                                        <div className="w-14 h-14 rounded-full bg-lightGray flex items-center justify-center">
                                            <i className="ph ph-briefcase text-2xl text-darkText"></i>
                                        </div>
                                    </div>
                                    <div className={`bg-white rounded-2xl p-6 custom-shadow flex justify-between items-center border-l-4 ${periodIsPositive ? 'border-neon' : 'border-danger'}`}>
                                        <div>
                                            <p className="text-sm text-gray-500 font-semibold mb-1">Saldo do Período</p>
                                            <h4 className={`text-4xl font-bold ${periodIsPositive ? 'text-green-600' : 'text-danger'}`}>
                                                {periodIsPositive ? '+' : '-'}{periodBalanceStr}
                                            </h4>
                                        </div>
                                        <div className="w-14 h-14 rounded-full bg-lightGray flex items-center justify-center">
                                            <i className="ph ph-scales text-2xl text-darkText"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'chart' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                <div className="md:col-span-2 bg-white rounded-3xl p-6 custom-shadow">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                                        <i className="ph ph-trend-up text-danger text-2xl"></i>
                                        Crescimento de Horas Negativas
                                    </h3>
                                    <GrowthChart data={chartData} />
                                </div>
                                <div className="bg-darkText text-white rounded-3xl p-6 custom-shadow flex flex-col justify-center relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-neon opacity-10 blur-3xl rounded-full -mr-10 -mt-10"></div>
                                    <h3 className="text-xl font-bold text-neon mb-4">Meta de Compensação</h3>
                                    <p className="text-gray-300 text-sm mb-6 leading-relaxed">
                                        {compMsg}
                                    </p>
                                    {!balanceIsPositive && (
                                        <div className="bg-white/10 p-4 rounded-xl border border-white/20">
                                            <p className="text-xs text-gray-400 uppercase tracking-widest font-bold mb-1">Défice Atual Global</p>
                                            <p className="text-2xl font-bold text-danger">{totalHoursStr} horas devidas</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {(activeTab === 'dashboard' || activeTab === 'calendar') && (
                            <div className="bg-white rounded-3xl p-6 custom-shadow">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold flex items-center gap-2">
                                        <span className="w-3 h-3 rounded-sm bg-neon inline-block"></span>
                                        Histórico de Registos 
                                        {activeTab === 'dashboard' && <span className="text-sm font-normal text-gray-500 ml-2">(Período Atual: {getCurrentPeriodLabel()})</span>}
                                        {activeTab === 'calendar' && (dateFilter.start || dateFilter.end) && <span className="text-sm font-normal text-gray-500 ml-2">(Filtrado)</span>}
                                    </h3>
                                </div>
                                
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs text-gray-500 uppercase bg-lightGray rounded-xl">
                                            <tr>
                                                <th className="px-4 py-3 rounded-l-xl">Data</th>
                                                <th className="px-4 py-3">Entrada 1</th>
                                                <th className="px-4 py-3">Saída 1</th>
                                                <th className="px-4 py-3">Entrada 2</th>
                                                <th className="px-4 py-3">Saída 2</th>
                                                <th className="px-4 py-3">Carga</th>
                                                <th className="px-4 py-3">Trabalhado</th>
                                                <th className="px-4 py-3">Previsão</th>
                                                <th className="px-4 py-3">Saldo</th>
                                                <th className="px-4 py-3">Anotações</th>
                                                <th className="px-4 py-3 rounded-r-xl text-center">Ações</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {displayedRecords.map((rec, idx) => (
                                                <tr key={rec.id} className="border-b border-gray-50 last:border-0 hover:bg-gray-50 transition">
                                                    <td className="px-4 py-3 font-semibold whitespace-nowrap">
                                                        {new Date(rec.date + 'T00:00:00').toLocaleDateString('pt-BR')}
                                                        <span className="text-gray-400 ml-2 text-xs uppercase">
                                                            {new Date(rec.date + 'T00:00:00').toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.','')}
                                                        </span>
                                                    </td>
                                                    <td className="px-4 py-3 text-gray-600">{rec.ent1 || '-'}</td>
                                                    <td className="px-4 py-3 text-gray-600">{rec.sai1 || '-'}</td>
                                                    <td className="px-4 py-3 text-gray-600">{rec.ent2 || '-'}</td>
                                                    <td className="px-4 py-3 text-gray-600">{rec.sai2 || '-'}</td>
                                                    <td className="px-4 py-3 font-medium text-gray-500">{rec.target}</td>
                                                    <td className="px-4 py-3 font-semibold">{rec.workedStr}</td>
                                                    <td className="px-4 py-3 text-xs text-gray-500">
                                                        {rec.expectedExit ? (
                                                            <span className="bg-gray-100 px-2 py-1 rounded-md text-nowrap">{rec.expectedExit}</span>
                                                        ) : '-'}
                                                    </td>
                                                    <td className="px-4 py-3">
                                                        <span className={`px-2 py-1 rounded-md font-bold text-xs ${
                                                            rec.balanceMins > 0 ? 'bg-neon/20 text-green-700' : 
                                                            rec.balanceMins < 0 ? 'bg-red-100 text-danger' : 
                                                            'bg-gray-100 text-gray-600'
                                                        }`}>
                                                            {rec.balanceMins > 0 ? '+' : ''}{rec.balanceStr}
                                                        </span>
                                                    </td>
                                                    <td className="px-4 py-3 text-gray-500 text-xs truncate max-w-[150px]" title={rec.note}>
                                                        {rec.note || '-'}
                                                    </td>
                                                    <td className="px-4 py-3 text-center flex justify-center gap-3">
                                                        <button onClick={() => { setActiveTab('dashboard'); handleEditClick(rec); }} className="text-gray-400 hover:text-darkText transition" title="Editar">
                                                            <i className="ph ph-pencil-simple text-lg"></i>
                                                        </button>
                                                        <button onClick={() => handleDeleteClick(rec.id)} className="text-gray-400 hover:text-danger transition" title="Excluir">
                                                            <i className="ph ph-trash text-lg"></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {displayedRecords.length === 0 && (
                                                <tr>
                                                    <td colSpan="11" className="text-center py-8 text-gray-500">
                                                        Nenhum registo encontrado para este período.<br/>
                                                        {activeTab === 'dashboard' && <span className="text-xs">Utilize o quadro de Registo Rápido acima para adicionar dias.</span>}
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
